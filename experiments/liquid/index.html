<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#04080c" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="data:," />
    <title>liquid surface</title>
  </head>
  <body>
    <div id="app">
      <canvas id="gl" aria-hidden="true"></canvas>
      <div id="fb" hidden><img alt="" /></div>
      <div id="surface"></div>
      <header class="cap top"><span class="brand" id="brand"></span><span id="idx" aria-live="polite"></span></header>
      <div class="cap bottom">
        <button type="button" id="prev" aria-label="Previous product"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="meta"><h2 id="ttl"></h2><p id="sub"></p></div>
        <button type="button" id="next" aria-label="Next product"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </div>
      <p id="hint">touch the water</p>
      <article id="detail" hidden>
        <button type="button" id="back"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Back</span></button>
        <div class="d-body">
          <div class="hero" id="hero"><img id="heroImg" alt="" /></div>
          <div class="d-text">
            <p class="d-idx" id="dIdx"></p>
            <h1 id="dTitle"></h1>
            <p class="d-price" id="dPrice"></p>
            <p class="d-desc" id="dDesc"></p>
            <button type="button" class="d-cta">Add to bag (mock)</button>
          </div>
          <div class="d-more" id="dMore"></div>
          <div class="d-det" id="dDet"></div>
          <p class="d-foot">liquid surface - prototype</p>
        </div>
      </article>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
