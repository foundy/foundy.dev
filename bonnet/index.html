<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bonnet - a product card demo</title>
    <meta name="description" content="Demo: a swipeable product card deck that opens into a detail page and pulls back down. A sample product, not for sale." />
    <meta name="theme-color" content="#f1e6d3" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23efe3cc'/%3E%3Cpath d='M7 20c0-7 4-12 9-12s9 5 9 12c-3 3-6 4-9 4s-6-1-9-4z' fill='%23fbf7f0' stroke='%238c6b45' stroke-width='1.6'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="page">
      <header class="top">
        <a class="brand" href="./">bonnet</a>
        <span class="pill">Demo &middot; sample product</span>
      </header>
      <main>
        <section id="deck" aria-roledescription="carousel" aria-label="Bonnet colours">
          <div id="stage"></div>
        </section>
      </main>
      <div class="controls">
        <button class="nav" id="prev" type="button" aria-label="Previous colour">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
        <div class="dots" id="dots"></div>
        <button class="nav" id="next" type="button" aria-label="Next colour">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" /></svg>
        </button>
      </div>
      <p class="hint">Swipe, or use the arrow keys. Tap a card to open it.</p>
      <footer class="foot">
        <span>Demo: a sample product, nothing is for sale.</span>
        <a href="https://foundy.dev">Made by foundy &rarr; foundy.dev</a>
      </footer>
    </div>
    <div id="live" class="sr" role="status" aria-live="polite"></div>
    <div id="sheet" role="dialog" aria-modal="true" aria-labelledby="dtitle" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
