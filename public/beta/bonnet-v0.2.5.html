function attachPullDown(card,i){var scroll=card.querySelector('.detail-scroll');var sx=0,sy=0,dx=0,dy=0,mode=null,armed=false,dragging=false;if(!scroll)return;scroll.addEventListener('touchstart',function(e){if(scroll.scrollTop>0)return;sx=e.touches[0].clientX;sy=e.touches[0].clientY;dx=0;dy=0;mode=null;armed=true;dragging=false},{passive:true});scroll.addEventListener('touchmove',function(e){if(!armed||!e.touches.length)return;dx=e.touches[0].clientX-sx;dy=e.touches[0].clientY-sy;var ax=Math.abs(dx),ay=Math.abs(dy);if(!mode&&(ax>6||ay>6))mode=ax>ay*1.15?'h':'v';if(mode==='h'){e.preventDefault();return}if(mode==='v'&&dy>0&&scroll.scrollTop<=0){e.preventDefault();dragging=true;var p=Math.min(1,dy/180),s=1-p*.09;card.classList.add('pulling');card.style.transition='none';scrim.style.transition='none';card.style.transform='translate3d(0,'+(dy*.72)+'px,0) scale('+s+')';card.style.borderRadius=(p*28)+'px';scrim.style.background='rgba(247,241,232,'+(0.96*(1-p))+')'}},{passive:false});scroll.addEventListener('touchend',function(){if(!armed)return;armed=false;if(!dragging)return;dragging=false;scrim.style.transition='';if(dy>110){closeDetail(card,i)}else{card.style.transition='transform 260ms cubic-bezier(.22,1,.36,1),border-radius 260ms cubic-bezier(.22,1,.36,1)';card.style.transform='translate3d(0,0,0) scale(1,1)';card.style.borderRadius='0';scrim.style.background='rgba(247,241,232,.96)';setTimeout(function(){card.classList.remove('pulling')},260)}})}
