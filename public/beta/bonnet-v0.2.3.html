<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Bonnet Beta v0.2.3</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8;}
</style>
</head>
<body>
<iframe id="preview" src="/beta/bonnet-v0.2.2.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('preview');

  var titleMap={
    'Ivory Crochet Bonnet':'/beta/assets/bonnet-beige-front.webp',
    'Red Crochet Bonnet':'/beta/assets/bonnet-red-front.webp',
    'Sky Blue Crochet Bonnet':'/beta/assets/bonnet-skyblue-front.webp',
    'Green Crochet Bonnet':'/beta/assets/bonnet-green-front.webp',
    'Yellow Crochet Bonnet':'/beta/assets/bonnet-yellow-front.webp'
  };

  function doc(){return frame.contentDocument;}

  function updateVersion(d){
    var ver=d.querySelector('.brand-sub .ver');
    if(ver)ver.textContent='(v0.2.3)';
  }

  function makeHeroOnly(card){
    if(!card || card.__v023HeroOnly)return;
    var titleEl=card.querySelector('.copy h2');
    var subEl=card.querySelector('.copy p');
    var tagEl=card.querySelector('.tag');
    var title=titleEl?titleEl.textContent:'';
    var src=titleMap[title];
    if(!src)return;
    var sub=subEl?subEl.textContent:'Handmade baby bonnet collection';
    var tag=tagEl?tagEl.textContent:'';
    var rect=card.getBoundingClientRect();
    card.__v023HeroOnly=true;
    card.style.transition='none';
    card.style.transformOrigin='top left';
    card.style.transform='translate3d('+rect.left+'px,'+rect.top+'px,0) scale('+(rect.width/window.innerWidth)+','+(rect.height/window.innerHeight)+')';
    card.innerHTML='<div class="hero"><img class="product-img" src="'+src+'" alt="'+title+'"><div class="shade"></div><div class="tag">'+tag+'</div><div class="copy"><h2>'+title+'</h2><p>'+sub+'</p></div></div>';
    card.offsetHeight;
  }

  function install(d){
    if(!d || d.__v023Installed)return;
    d.__v023Installed=true;

    var style=d.createElement('style');
    style.id='beta-v0-2-3-close-style';
    style.textContent=[
      '.card.promoted.v023-hero-close .hero{position:absolute!important;inset:0!important;}',
      '.card.promoted.v023-hero-close .copy h2{font-size:30px!important;line-height:1.02!important;letter-spacing:-.06em!important;}',
      '.card.promoted.v023-hero-close .copy{left:24px!important;right:24px!important;bottom:24px!important;}'
    ].join('\n');
    d.head.appendChild(style);

    var closeBtn=d.getElementById('closeBtn');
    if(closeBtn){
      closeBtn.addEventListener('pointerdown',function(){
        var card=d.querySelector('.card.promoted');
        if(card){card.classList.add('v023-hero-close');makeHeroOnly(card);}
      },true);
      closeBtn.addEventListener('click',function(){
        var card=d.querySelector('.card.promoted');
        if(card){card.classList.add('v023-hero-close');makeHeroOnly(card);}
      },true);
    }

    new MutationObserver(function(){
      updateVersion(d);
      var closing=d.querySelector('.card.promoted.closing:not(.v023-hero-close)');
      if(closing){closing.classList.add('v023-hero-close');makeHeroOnly(closing);}
    }).observe(d.documentElement,{subtree:true,attributes:true,childList:true,attributeFilter:['class']});
  }

  function tick(){
    var d=doc();
    if(!d)return;
    updateVersion(d);
    install(d);
  }

  frame.addEventListener('load',tick);
  setInterval(tick,120);
})();
</script>
</body>
</html>
