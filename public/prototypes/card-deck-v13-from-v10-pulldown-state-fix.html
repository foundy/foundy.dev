<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Card Deck v13 PullDown State Fix</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8}
</style>
</head>
<body>
<iframe id="preview" src="/prototypes/card-deck-v10-from-v2-shared-hero.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('preview');

  function inject(){
    var doc=frame.contentDocument;
    if(!doc)return;

    if(!doc.getElementById('v13-pulldown-style')){
      var style=doc.createElement('style');
      style.id='v13-pulldown-style';
      style.textContent=[
        'html,body{overflow:hidden!important;overscroll-behavior:none!important;}',
        '.detail-layer{overflow:hidden!important;touch-action:none!important;}',
        '.detail-card{overflow:hidden!important;max-width:100vw!important;touch-action:pan-y!important;}',
        '.detail-scroll{overflow-x:hidden!important;overflow-y:auto!important;width:100%!important;max-width:100vw!important;touch-action:pan-y!important;overscroll-behavior-y:contain!important;overscroll-behavior-x:none!important;}',
        '.detail-scroll>*{max-width:100vw!important;}',
        '.hero-box,.shared-scale,.shared-hero,.detail-body{max-width:100vw!important;}',
        '.detail-body{overflow-x:hidden!important;}'
      ].join('\n');
      doc.head.appendChild(style);
    }

    function findOriginalCard(detailCard){
      var title = detailCard && detailCard.querySelector('.shared-copy h2');
      var text = title ? title.textContent.trim() : '';
      var cards = Array.prototype.slice.call(doc.querySelectorAll('#deck .card'));
      return cards.find(function(card){
        var h = card.querySelector('.shared-copy h2');
        return h && h.textContent.trim() === text;
      }) || cards.find(function(card){ return card.style.visibility === 'hidden'; }) || cards[0];
    }

    function patchScroll(scrollEl){
      if(!scrollEl || scrollEl.__v13Patched) return;
      scrollEl.__v13Patched=true;

      var sx=0, sy=0, dx=0, dy=0, mode=null, armed=false, dragging=false;

      scrollEl.addEventListener('touchstart',function(e){
        if(!e.touches || !e.touches.length) return;
        sx=e.touches[0].clientX;
        sy=e.touches[0].clientY;
        dx=0; dy=0; mode=null; dragging=false;
        armed=scrollEl.scrollTop<=0;
      },{capture:true,passive:true});

      scrollEl.addEventListener('touchmove',function(e){
        if(!armed || !e.touches || !e.touches.length) return;
        dx=e.touches[0].clientX-sx;
        dy=e.touches[0].clientY-sy;
        var ax=Math.abs(dx), ay=Math.abs(dy);
        if(!mode && (ax>6 || ay>6)) mode=ax>ay*1.15?'horizontal':'vertical';

        if(mode==='horizontal'){
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }

        if(mode==='vertical' && dy>0 && scrollEl.scrollTop<=0){
          e.preventDefault();
          e.stopImmediatePropagation();
          dragging=true;
          var detail=scrollEl.closest('.detail-card');
          var layer=detail && detail.closest('.detail-layer');
          var body=detail && detail.querySelector('.detail-body');
          if(!detail || !layer) return false;
          var p=Math.min(1,dy/160);
          var scale=1-p*.08;
          detail.style.transition='none';
          layer.style.transition='none';
          detail.style.transform='translate3d(0,'+(dy*.72)+'px,0) scale('+scale+')';
          detail.style.borderRadius=(p*28)+'px';
          layer.style.background='rgba(247,241,232,'+(0.96*(1-p))+')';
          if(body) body.style.opacity=String(1-p);
          return false;
        }
      },{capture:true,passive:false});

      scrollEl.addEventListener('touchend',function(e){
        if(!armed) return;
        armed=false;
        if(!dragging) return;
        dragging=false;
        e.preventDefault();
        e.stopImmediatePropagation();

        var detail=scrollEl.closest('.detail-card');
        var layer=detail && detail.closest('.detail-layer');
        var body=detail && detail.querySelector('.detail-body');
        var closeBtn=layer && layer.querySelector('.close-btn');
        if(!detail || !layer) return false;

        detail.style.transition='';
        layer.style.transition='';

        if(dy<=110){
          detail.style.transform='';
          detail.style.borderRadius='0px';
          layer.style.background='rgba(247,241,232,.96)';
          if(body) body.style.opacity='';
          return false;
        }

        var visual=detail.getBoundingClientRect();
        var original=findOriginalCard(detail);
        var target=original.getBoundingClientRect();
        var cardScale=target.width / window.innerWidth;

        layer.classList.add('closing');
        detail.classList.add('closing');
        if(body){
          body.style.transition='opacity 120ms ease, transform 120ms ease';
          body.style.opacity='0';
          body.style.transform='translateY(18px)';
        }
        scrollEl.scrollTop=0;

        detail.style.transition='none';
        detail.style.left=visual.left+'px';
        detail.style.top=visual.top+'px';
        detail.style.width=visual.width+'px';
        detail.style.height=visual.height+'px';
        detail.style.transform='none';
        detail.style.borderRadius='28px';
        detail.offsetHeight;

        requestAnimationFrame(function(){
          layer.style.background='rgba(247,241,232,0)';
          detail.style.transition='left 520ms cubic-bezier(.22,1,.36,1), top 520ms cubic-bezier(.22,1,.36,1), width 520ms cubic-bezier(.22,1,.36,1), height 520ms cubic-bezier(.22,1,.36,1), border-radius 520ms cubic-bezier(.22,1,.36,1), box-shadow 520ms cubic-bezier(.22,1,.36,1)';
          layer.style.transition='background 520ms cubic-bezier(.22,1,.36,1)';
          detail.style.left=target.left+'px';
          detail.style.top=target.top+'px';
          detail.style.width=target.width+'px';
          detail.style.height=target.height+'px';
          detail.style.borderRadius='28px';
          detail.style.boxShadow='0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08)';
          detail.style.setProperty('--heroScale',cardScale);
        });

        setTimeout(function(){
          // 내부 v10의 closeDetail을 반드시 태워 detailOpen=false를 복구한다.
          // 다만 직접 만든 축소 모션 후라 시각적 중복을 막기 위해 layer는 숨긴 뒤 원래 close를 호출한다.
          layer.style.opacity='0';
          layer.style.pointerEvents='none';
          if(closeBtn){
            closeBtn.click();
          }else{
            if(original) original.style.visibility='';
            var app=doc.getElementById('app');
            if(app) app.classList.remove('detail-open');
            if(layer && layer.parentNode) layer.parentNode.removeChild(layer);
          }
        },540);

        return false;
      },{capture:true,passive:false});
    }

    function patchAll(){
      doc.querySelectorAll('.detail-scroll').forEach(patchScroll);
    }

    patchAll();
    if(!doc.__v13Observer){
      doc.__v13Observer=new MutationObserver(patchAll);
      doc.__v13Observer.observe(doc.documentElement,{childList:true,subtree:true});
    }
  }

  frame.addEventListener('load',inject);
  setInterval(inject,500);
})();
</script>
</body>
</html>
