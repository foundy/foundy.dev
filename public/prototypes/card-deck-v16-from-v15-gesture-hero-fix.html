<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Card Deck v16 Gesture Hero Fix</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8}iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8}</style></head><body><iframe id="preview" src="/prototypes/card-deck-v15-from-v10-transform-detail.html"></iframe><script>(function(){var frame=document.getElementById('preview');function inject(){var doc=frame.contentDocument;var win=frame.contentWindow;if(!doc||!win)return;if(!doc.getElementById('v16-style')){var style=doc.createElement('style');style.id='v16-style';style.textContent='.detail-card{overflow:hidden!important;max-width:100vw!important;touch-action:pan-y!important}.detail-scroll{overflow-x:hidden!important;overscroll-behavior-x:none!important;touch-action:pan-y!important}.detail-card .shared-scale{transform:scale(1)!important}.detail-card.closing .shared-scale{transform:scale(1)!important}.detail-layer{overflow:hidden!important}.deck,.stage{touch-action:none!important}';doc.head.appendChild(style)}function forceDetailHeroScale(){doc.querySelectorAll('.detail-card').forEach(function(el){if(el.style.getPropertyValue('--heroScale')!=='1')el.style.setProperty('--heroScale','1')})}forceDetailHeroScale();if(!doc.__v16HeroObserver){doc.__v16HeroObserver=new MutationObserver(forceDetailHeroScale);doc.__v16HeroObserver.observe(doc.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['style','class']})}if(!doc.__v16DeckGesture){doc.__v16DeckGesture=true;var sx=0,sy=0,mode=null,watching=false;function inDeck(t){var deck=doc.getElementById('deck');return deck&&(t===deck||deck.contains(t))}function cleanupDeckDrag(){doc.querySelectorAll('#deck .card.dragging-now').forEach(function(card){card.classList.remove('dragging-now','throwing-now');card.style.transform='';card.style.opacity='';card.style.zIndex=''})}doc.addEventListener('touchstart',function(e){if(doc.querySelector('.detail-card'))return;if(!e.touches||!e.touches.length)return;if(!inDeck(e.target))return;watching=true;mode=null;sx=e.touches[0].clientX;sy=e.touches[0].clientY},{capture:true,passive:true});doc.addEventListener('touchmove',function(e){if(!watching||!e.touches||!e.touches.length)return;var dx=e.touches[0].clientX-sx;var dy=e.touches[0].clientY-sy;var ax=Math.abs(dx),ay=Math.abs(dy);if(!mode&&(ax>7||ay>7))mode=ay>ax*1.15?'vertical':'horizontal';if(mode==='vertical'){cleanupDeckDrag();e.preventDefault();e.stopImmediatePropagation();return false}},{capture:true,passive:false});doc.addEventListener('touchend',function(){watching=false;mode=null;setTimeout(cleanupDeckDrag,0)},{capture:true,passive:true});doc.addEventListener('touchcancel',function(){watching=false;mode=null;cleanupDeckDrag()},{capture:true,passive:true})}}frame.addEventListener('load',inject);setInterval(inject,250)})();</script></body></html>
