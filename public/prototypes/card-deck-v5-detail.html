<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Card Deck v5 Detail</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f1e8;color:#2a211b}body{overflow:hidden}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:24px 18px 22px}header{text-align:center}h1{margin:0 0 6px;font-size:20px;letter-spacing:-.04em}.note{margin:0 auto;max-width:360px;color:#806f60;font-size:13px;line-height:1.45}.stage{display:grid;place-items:center;min-height:520px;touch-action:none;user-select:none}.deck{position:relative;width:clamp(260px,72vw,310px);aspect-ratio:310/430;max-height:430px;perspective:1000px;touch-action:none;cursor:grab}.card{position:absolute;inset:0;border-radius:28px;padding:22px;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08);border:1px solid rgba(255,255,255,.62);transition:transform 520ms cubic-bezier(.18,1.15,.24,1),opacity 280ms ease,filter 280ms ease;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.tag{align-self:flex-start;padding:7px 10px;border-radius:999px;background:rgba(255,255,255,.5);font-size:12px;font-weight:700;color:rgba(42,33,27,.62)}.emoji{flex:1;display:grid;place-items:center;font-size:90px;filter:drop-shadow(0 18px 18px rgba(0,0,0,.1))}.card h2{margin:0;font-size:30px;line-height:1.02;letter-spacing:-.06em}.card p{margin:8px 0 0;color:rgba(42,33,27,.65);font-size:14px;line-height:1.45}.dragging{transition:none!important;z-index:10!important}.reveal{transition:transform 180ms cubic-bezier(.18,1.15,.24,1),opacity 160ms ease,filter 160ms ease!important;z-index:9!important}.follow{transition:transform 160ms cubic-bezier(.16,.84,.29,1),opacity 160ms ease!important;z-index:10!important}.tuck{transition:transform 680ms cubic-bezier(.19,1,.22,1),opacity 560ms ease,filter 560ms ease!important;z-index:8!important}.settling .card{transition:none!important}.controls{display:flex;justify-content:center;gap:10px;min-height:54px;z-index:30}.btn{border:0;min-width:112px;padding:14px 18px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:#2a211b;color:white;box-shadow:0 12px 24px rgba(42,33,27,.18)}.ghost{background:rgba(255,255,255,.84);color:#2a211b;border:1px solid rgba(42,33,27,.1)}.pager{height:22px;display:flex;justify-content:center;gap:8px}.dot{width:8px;height:8px;border-radius:50%;background:#2a211b;opacity:.24;transition:transform .2s,opacity .2s}.dot.on{opacity:1;transform:scale(1.25)}.status{text-align:center;color:#806f60;font-size:12px}.detail-layer{position:fixed;inset:0;z-index:1000;pointer-events:none;background:rgba(247,241,232,0);transition:background 320ms ease}.detail-layer.visible{pointer-events:auto;background:rgba(247,241,232,.96)}.detail-card{position:fixed;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 40px 120px rgba(42,33,27,.28);border:1px solid rgba(255,255,255,.62);will-change:top,left,width,height,border-radius;transition:top 620ms cubic-bezier(.19,1,.22,1),left 620ms cubic-bezier(.19,1,.22,1),width 620ms cubic-bezier(.19,1,.22,1),height 620ms cubic-bezier(.19,1,.22,1),border-radius 620ms cubic-bezier(.19,1,.22,1)}.detail-scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;opacity:0;transform:translateY(18px);transition:opacity 260ms ease,transform 360ms cubic-bezier(.19,1,.22,1)}.detail-card.opened .detail-scroll{opacity:1;transform:translateY(0)}.detail-hero{min-height:52vh;display:grid;place-items:center;padding:64px 24px 34px}.detail-emoji{font-size:128px;filter:drop-shadow(0 24px 28px rgba(0,0,0,.12))}.detail-content{background:rgba(255,255,255,.72);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.56);border-radius:32px 32px 0 0;margin-top:-24px;padding:32px 24px 80px}.detail-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(42,33,27,.08);font-size:12px;font-weight:800;color:rgba(42,33,27,.62);margin-bottom:14px}.detail-content h2{font-size:38px;line-height:.98;letter-spacing:-.07em;margin:0 0 14px}.detail-lead{font-size:17px;line-height:1.55;color:rgba(42,33,27,.72);margin:0 0 28px}.story{padding:22px 0;border-top:1px solid rgba(42,33,27,.08)}.story h3{margin:0 0 8px;font-size:18px;letter-spacing:-.04em}.story p{margin:0;color:rgba(42,33,27,.68);font-size:15px;line-height:1.65}.close-btn{position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top));z-index:1002;width:38px;height:38px;border:0;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(42,33,27,.14);font-size:22px;font-weight:700;color:#2a211b;opacity:0;transform:scale(.88);transition:opacity 220ms ease,transform 260ms ease}.visible .close-btn{opacity:1;transform:scale(1)}.detail-open .deck{pointer-events:none}.detail-open header,.detail-open .controls,.detail-open .pager,.detail-open .status{opacity:.18;transition:opacity 240ms ease}@media(max-height:720px){.stage{min-height:450px}.deck{width:260px}.emoji{font-size:72px}.detail-content h2{font-size:34px}.detail-emoji{font-size:108px}}
</style>
</head>
<body>
<main class="app" id="app"><header><h1>왕복 가능한 Overlap Card Deck</h1><p class="note">탭하면 App Store Today 카드처럼 full-screen 상세로 확장됩니다.</p></header><section class="stage"><div class="deck" id="deck"></div></section><nav class="controls"><button class="btn ghost" id="prevBtn">← Swipe</button><button class="btn primary" id="nextBtn">Swipe →</button></nav><div class="pager" id="pager"></div><div class="status" id="status">탭하면 상세 · 드래그하면 카드 전환</div></main>
<script>
(function(){
var data=[
{id:1,tag:'HANDMADE',title:'Baby Bonnet',emoji:'🧸',c1:'#FFE2BE',c2:'#F4B8A0',lead:'손으로 만든 따뜻한 보넷을 중심으로 아기의 하루를 감성적으로 소개하는 스토리입니다.'},
{id:2,tag:'WOOL',title:'Knit Blanket',emoji:'🧶',c1:'#D7EEDC',c2:'#A4D8C9',lead:'부드러운 니트 질감과 차분한 컬러가 만드는 아기 공간의 분위기를 보여줍니다.'},
{id:3,tag:'CURATED',title:'Gentle Toy',emoji:'🌼',c1:'#FFF1A6',c2:'#F1C66F',lead:'작은 장난감이 가진 촉감, 색감, 기억을 하나의 큐레이션 스토리로 풀어냅니다.'},
{id:4,tag:'COTTON',title:'Daily Socks',emoji:'🧦',c1:'#DCE8FF',c2:'#AABBEA',lead:'매일 신는 작은 양말을 통해 일상의 리듬과 따뜻한 순간을 전달합니다.'},
{id:5,tag:'NEW',title:'Cloud Bib',emoji:'☁️',c1:'#F9DCE8',c2:'#EEABC4',lead:'구름처럼 부드러운 빕을 중심으로 식사 시간의 작고 귀여운 장면을 보여줍니다.'}
];
var app=document.getElementById('app'),deck=document.getElementById('deck'),pager=document.getElementById('pager'),status=document.getElementById('status'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn');
var active=0,isDown=false,startX=0,startY=0,activeCard=null,revealCard=null,detailOpen=false,lock=false;
var pos=[[0,0,0,1,5,1,0],[48,18,7,.91,3,.78,.3],[92,36,12,.82,1,.58,.6],[-92,36,-12,.82,1,.58,.6],[-48,18,-7,.91,2,.78,.3]];
function render(){deck.innerHTML='';pager.innerHTML='';data.forEach(function(d,i){var el=document.createElement('article');el.className='card';el.dataset.index=i;el.style.setProperty('--c1',d.c1);el.style.setProperty('--c2',d.c2);el.innerHTML='<div class="tag">'+d.tag+'</div><div class="emoji">'+d.emoji+'</div><div><h2>'+d.title+'</h2><p>탭하면 상세로 확장되고, 드래그하면 덱이 전환됩니다.</p></div>';deck.appendChild(el);var dot=document.createElement('span');dot.className='dot';pager.appendChild(dot)});apply()}
function cards(){return [].slice.call(deck.querySelectorAll('.card'))}
function apply(){cards().forEach(function(el,i){var r=(i-active+5)%5,f=pos[r];el.style.transform='translate3d('+f[0]+'px,'+f[1]+'px,0) rotate('+f[2]+'deg) scale('+f[3]+')';el.style.zIndex=f[4];el.style.opacity=f[5];el.style.filter='blur('+f[6]+'px) saturate('+(1-r*.04)+')'});[].slice.call(pager.children).forEach(function(dot,i){dot.className='dot'+(i===active?' on':'')});status.textContent='현재 카드 '+(active+1)+' / '+data.length+' · 탭하면 상세'}
function activeEl(){return cards()[active]}function offsetEl(o){return cards()[(active+o+5)%5]}function go(delta){if(lock||detailOpen)return;active=(active+delta+5)%5;apply()}
function pt(e){return e.touches&&e.touches.length?e.touches[0]:e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e}
function clearReveal(){if(!revealCard)return;revealCard.classList.remove('reveal');revealCard.style.zIndex='';revealCard=null;apply()}
function reveal(dx){if(Math.abs(dx)<8){clearReveal();return}var next=offsetEl(dx<0?1:-1);if(next!==revealCard){if(revealCard)revealCard.classList.remove('reveal');revealCard=next;revealCard.classList.add('reveal')}var p=Math.min(1,Math.abs(dx)/150),side=dx<0?1:-1,x=side*(42-24*p),y=17-10*p,rot=side*(6-4*p),sc=.91+.055*p;revealCard.style.transform='translate3d('+x+'px,'+y+'px,-18px) rotate('+rot+'deg) scale('+sc+')';revealCard.style.opacity=String(.78+.16*p);revealCard.style.zIndex='9'}
function openDetail(card){if(detailOpen)return;detailOpen=true;var d=data[+card.dataset.index],rect=card.getBoundingClientRect(),layer=document.createElement('div'),detail=document.createElement('article'),close=document.createElement('button');layer.className='detail-layer';detail.className='detail-card';close.className='close-btn';close.textContent='×';detail.style.setProperty('--c1',d.c1);detail.style.setProperty('--c2',d.c2);detail.style.left=rect.left+'px';detail.style.top=rect.top+'px';detail.style.width=rect.width+'px';detail.style.height=rect.height+'px';detail.innerHTML='<div class="detail-scroll"><section class="detail-hero"><div class="detail-emoji">'+d.emoji+'</div></section><section class="detail-content"><div class="detail-kicker">'+d.tag+'</div><h2>'+d.title+'</h2><p class="detail-lead">'+d.lead+'</p><div class="story"><h3>오늘의 장면</h3><p>작은 상품 하나를 중심으로 아기의 하루, 촉감, 색감, 분위기를 연결해 보여주는 storytelling 영역입니다.</p></div><div class="story"><h3>핸드메이드 무드</h3><p>제품의 기능보다 먼저 감정과 장면을 전달합니다. 사용자는 상품을 고르는 것이 아니라 하나의 이야기를 넘겨보는 느낌을 받습니다.</p></div><div class="story"><h3>추천 포인트</h3><p>상세는 긴 콘텐츠를 담을 수 있도록 전체가 스크롤됩니다. 상단 이미지 영역과 하단 콘텐츠가 하나의 카드 안에서 자연스럽게 이어집니다.</p></div><div class="story"><h3>마무리</h3><p>닫기 버튼을 누르면 이 상세 카드는 다시 원래 덱의 active card 위치로 축소되며 복귀합니다.</p></div></section></div>';layer.appendChild(detail);layer.appendChild(close);document.body.appendChild(layer);app.classList.add('detail-open');card.style.visibility='hidden';requestAnimationFrame(function(){layer.classList.add('visible');detail.style.left='0';detail.style.top='0';detail.style.width='100vw';detail.style.height='100dvh';detail.style.borderRadius='0'});setTimeout(function(){detail.classList.add('opened')},520);close.onclick=function(){detail.classList.remove('opened');layer.classList.remove('visible');var target=card.getBoundingClientRect();detail.style.left=target.left+'px';detail.style.top=target.top+'px';detail.style.width=target.width+'px';detail.style.height=target.height+'px';detail.style.borderRadius='28px';setTimeout(function(){card.style.visibility='';app.classList.remove('detail-open');layer.remove();detailOpen=false},640)}}
function start(e){if(lock||detailOpen)return;if(!(e.target===deck||deck.contains(e.target)))return;var p=pt(e);activeCard=activeEl();isDown=true;startX=p.clientX;startY=p.clientY;clearReveal();activeCard.classList.add('dragging');activeCard.style.zIndex='10';if(e.cancelable)e.preventDefault()}
function move(e){if(!isDown||!activeCard)return;var p=pt(e),dx=p.clientX-startX,dy=p.clientY-startY;if(e.cancelable)e.preventDefault();reveal(dx);var lift=Math.min(26,Math.abs(dx)*.07),rot=dx*.05,op=Math.max(.74,1-Math.abs(dx)/460);activeCard.style.transform='translate3d('+dx+'px,'+(dy-lift)+'px,0) rotate('+rot+'deg) scale(1.025)';activeCard.style.opacity=String(op)}
function end(e){if(!isDown||!activeCard)return;var p=pt(e),dx=p.clientX-startX,dy=p.clientY-startY,absX=Math.abs(dx),dist=Math.hypot(dx,dy),tap=dist<8,swipe=absX>18&&(absX>34||(dist>72&&absX>24)||(dist>112&&absX>16)),delta=dx<0?1:-1,side=dx<0?1:-1;isDown=false;if(e.cancelable)e.preventDefault();if(tap){activeCard.classList.remove('dragging');activeCard.style.transform='';activeCard.style.opacity='';activeCard.style.zIndex='';clearReveal();openDetail(activeCard);activeCard=null;return}if(swipe){var followX=dx+side*42,followY=dy-10,followRot=dx*.05+side*4,tuckX=side*70,tuckY=30,tuckRot=side*10;lock=true;activeCard.classList.remove('dragging');activeCard.classList.add('follow');activeCard.style.transform='translate3d('+followX+'px,'+followY+'px,0) rotate('+followRot+'deg) scale(1.01)';activeCard.style.opacity='.86';setTimeout(function(){if(!activeCard)return;activeCard.classList.remove('follow');activeCard.classList.add('tuck');activeCard.style.transform='translate3d('+tuckX+'px,'+tuckY+'px,-44px) rotate('+tuckRot+'deg) scale(.84)';activeCard.style.opacity='.68'},130);setTimeout(function(){var old=activeCard;deck.classList.add('settling');if(old){old.classList.remove('dragging','follow','tuck');old.style.transform='';old.style.opacity='';old.style.zIndex='';old.style.filter=''}if(revealCard){revealCard.classList.remove('reveal');revealCard=null}activeCard=null;active=(active+delta+5)%5;apply();deck.offsetHeight;requestAnimationFrame(function(){requestAnimationFrame(function(){deck.classList.remove('settling');lock=false})})},690)}else{activeCard.classList.remove('dragging');activeCard.style.transform='';activeCard.style.opacity='';activeCard.style.zIndex='';clearReveal();apply();activeCard=null}}
deck.addEventListener('touchstart',start,{passive:false});deck.addEventListener('touchmove',move,{passive:false});deck.addEventListener('touchend',end,{passive:false});deck.addEventListener('touchcancel',function(){isDown=false;if(activeCard){activeCard.classList.remove('dragging','follow','tuck');activeCard=null}apply()},{passive:false});deck.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);prevBtn.onclick=function(){go(-1)};nextBtn.onclick=function(){go(1)};render();
})();
</script>
</body>
</html>
