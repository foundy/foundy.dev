<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Card Deck v10 Shared Hero</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1e8;color:#2a211b}body{overflow:hidden}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:24px 18px 22px}header{text-align:center}h1{margin:0 0 6px;font-size:20px;letter-spacing:-.04em}.note{margin:0 auto;max-width:360px;color:#806f60;font-size:13px;line-height:1.45}.stage{position:relative;display:grid;place-items:center;min-height:520px;touch-action:none;user-select:none;-webkit-user-select:none}.deck{position:relative;width:min(72vw,310px);height:min(106vw,430px);max-height:430px;min-height:390px;perspective:1000px;touch-action:none;cursor:grab}.card{position:absolute;inset:0;border-radius:28px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08);border:1px solid rgba(255,255,255,.62);overflow:hidden;transition:transform 520ms cubic-bezier(.18,1.15,.24,1),opacity 280ms ease,filter 280ms ease;will-change:transform;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.shared-scale{position:relative;width:var(--heroW);height:var(--heroH);transform:scale(var(--heroScale));transform-origin:top left;transition:transform 600ms cubic-bezier(.22,1,.36,1)}.shared-hero{position:absolute;inset:0;background:radial-gradient(circle at 50% 32%,var(--glow) 0%,transparent 55%),linear-gradient(145deg,var(--c1),var(--c2));overflow:hidden}.shared-tag{position:absolute;top:28px;left:28px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.5);font-size:13px;font-weight:800;color:rgba(42,33,27,.62)}.shared-emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:138px;filter:drop-shadow(0 24px 28px rgba(0,0,0,.12))}.shared-copy{position:absolute;left:32px;right:32px;bottom:38px}.shared-copy h2{margin:0;font-size:44px;line-height:1.06;letter-spacing:-.06em;font-weight:750;color:#2a211b}.shared-copy p{margin:10px 0 0;color:rgba(42,33,27,.66);font-size:17px;line-height:1.45}.card:nth-child(1){transform:translate3d(0,0,0) rotate(0deg) scale(1);z-index:5;opacity:1}.card:nth-child(2){transform:translate3d(48px,18px,0) rotate(7deg) scale(.91);z-index:3;opacity:.78}.card:nth-child(3){transform:translate3d(92px,36px,0) rotate(12deg) scale(.82);z-index:1;opacity:.58}.card:nth-child(4){transform:translate3d(-92px,36px,0) rotate(-12deg) scale(.82);z-index:1;opacity:.58}.card:nth-child(5){transform:translate3d(-48px,18px,0) rotate(-7deg) scale(.91);z-index:2;opacity:.78}.controls{min-height:54px;display:flex;gap:10px;align-items:center;justify-content:center;z-index:20}.btn{appearance:none;border:0;display:inline-flex;align-items:center;justify-content:center;min-width:112px;padding:14px 18px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent}.primary{background:#2a211b;color:white;box-shadow:0 12px 24px rgba(42,33,27,.18)}.ghost{background:rgba(255,255,255,.84);color:#2a211b;border:1px solid rgba(42,33,27,.1)}.pager{display:flex;justify-content:center;gap:8px;min-height:22px}.dot{width:8px;height:8px;border-radius:50%;background:#2a211b;opacity:.25;transition:opacity .2s,transform .2s}.dot.on{opacity:1;transform:scale(1.25)}.status{text-align:center;color:#806f60;font-size:12px;position:relative;z-index:30}.dragging-now{transition:none!important;z-index:10!important}.throwing-now{transition:transform 260ms cubic-bezier(.16,.84,.29,1),opacity 220ms ease!important;opacity:0!important;z-index:10!important}.reveal-behind{transition:transform 180ms cubic-bezier(.18,1.15,.24,1),opacity 160ms ease,filter 160ms ease!important;z-index:9!important;opacity:.92!important;filter:saturate(1)!important}.detail-open .deck{pointer-events:none}.detail-open header,.detail-open .controls,.detail-open .pager,.detail-open .status{opacity:.18;transition:opacity 240ms ease}.detail-layer{position:fixed;inset:0;z-index:1000;pointer-events:none;background:rgba(247,241,232,0);transition:background 600ms cubic-bezier(.22,1,.36,1)}.detail-layer.visible{pointer-events:auto;background:rgba(247,241,232,.96)}.detail-card{position:fixed;overflow:hidden;border-radius:28px;background:linear-gradient(145deg,var(--c1),var(--c2));box-shadow:0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08);border:1px solid rgba(255,255,255,.62);will-change:top,left,width,height,border-radius,transform;transition:top 600ms cubic-bezier(.22,1,.36,1),left 600ms cubic-bezier(.22,1,.36,1),width 600ms cubic-bezier(.22,1,.36,1),height 600ms cubic-bezier(.22,1,.36,1),border-radius 600ms cubic-bezier(.22,1,.36,1),transform 360ms cubic-bezier(.22,1,.36,1),box-shadow 600ms cubic-bezier(.22,1,.36,1)}.detail-scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}.hero-box{position:relative;width:var(--heroW);height:var(--heroH);transition:height 600ms cubic-bezier(.22,1,.36,1)}.detail-body{background:rgba(255,255,255,.76);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.56);border-radius:32px 32px 0 0;margin-top:-28px;padding:32px 24px 88px;opacity:0;transform:translateY(28px);transition:opacity 320ms ease 260ms,transform 420ms cubic-bezier(.22,1,.36,1) 260ms}.detail-card.open .detail-body{opacity:1;transform:translateY(0)}.detail-card.closing .detail-body{opacity:0!important;transform:translateY(20px)!important;transition:opacity 160ms ease,transform 160ms ease!important}.detail-kicker{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(42,33,27,.08);font-size:12px;font-weight:800;color:rgba(42,33,27,.62);margin-bottom:14px}.detail-body h3{font-size:30px;line-height:1.08;letter-spacing:-.05em;margin:0 0 14px}.detail-lead{font-size:17px;line-height:1.6;color:rgba(42,33,27,.72);margin:0 0 28px}.story{padding:22px 0;border-top:1px solid rgba(42,33,27,.08)}.story h4{margin:0 0 8px;font-size:18px;letter-spacing:-.04em}.story p{margin:0;color:rgba(42,33,27,.68);font-size:15px;line-height:1.65}.close-btn{position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top));z-index:1002;width:38px;height:38px;border:0;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(42,33,27,.14);font-size:22px;font-weight:700;color:#2a211b;opacity:0;transform:scale(.88);transition:opacity 220ms ease 280ms,transform 260ms ease 280ms}.detail-layer.visible .close-btn{opacity:1;transform:scale(1)}.detail-layer.closing .close-btn{opacity:0;transform:scale(.88);transition:opacity 120ms ease,transform 120ms ease}@media(max-height:720px){.stage{min-height:450px}.deck{width:260px;height:360px;min-height:360px}.shared-emoji{font-size:112px}.shared-copy h2{font-size:38px}.shared-copy p{font-size:15px}}</style></head><body><main class="app" id="app"><header><h1>왕복 가능한 Overlap Card Deck</h1><p class="note">v2 덱 모션 유지 · 덱/상세가 동일한 shared hero를 scale만 다르게 사용합니다.</p></header><section class="stage"><div class="deck" id="deck"></div></section><nav class="controls"><button class="btn ghost" id="prevBtn">← Swipe</button><button class="btn primary" id="nextBtn">Swipe →</button></nav><div class="pager" id="pager"><span class="dot on"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><div class="status" id="status">탭하면 상세 · 드래그하면 카드 전환</div></main><script>(function(){var items=[{title:'Baby Bonnet',tag:'HANDMADE',emoji:'🧸',c1:'#FFE2BE',c2:'#F4B8A0',glow:'#FFF2DF',lead:'손으로 만든 따뜻한 보넷을 중심으로 아기의 하루를 감성적으로 소개하는 스토리입니다.'},{title:'Knit Blanket',tag:'WOOL',emoji:'🧶',c1:'#D7EEDC',c2:'#A4D8C9',glow:'#E9F7E8',lead:'부드러운 니트 질감과 차분한 컬러가 만드는 아기 공간의 분위기를 보여줍니다.'},{title:'Gentle Toy',tag:'CURATED',emoji:'🌼',c1:'#FFF1A6',c2:'#F1C66F',glow:'#FFF8C8',lead:'작은 장난감이 가진 촉감, 색감, 기억을 하나의 큐레이션 스토리로 풀어냅니다.'},{title:'Daily Socks',tag:'COTTON',emoji:'🧦',c1:'#DCE8FF',c2:'#AABBEA',glow:'#EEF4FF',lead:'매일 신는 작은 양말을 통해 일상의 리듬과 따뜻한 순간을 전달합니다.'},{title:'Cloud Bib',tag:'NEW',emoji:'☁️',c1:'#F9DCE8',c2:'#EEABC4',glow:'#FFF0F6',lead:'구름처럼 부드러운 빕을 중심으로 식사 시간의 작고 귀여운 장면을 보여줍니다.'}];var app=document.getElementById('app'),deck=document.getElementById('deck'),stage=document.querySelector('.stage'),status=document.getElementById('status'),prevBtn=document.getElementById('prevBtn'),nextBtn=document.getElementById('nextBtn'),pager=document.getElementById('pager');var active=0,isDown=false,startX=0,startY=0,activeCard=null,revealCard=null,lockUntil=0,detailOpen=false,heroW=innerWidth,heroH=560,heroScale=1;var pos=[[0,0,0,1,5,1,0],[48,18,7,.91,3,.78,.3],[92,36,12,.82,1,.58,.6],[-92,36,-12,.82,1,.58,.6],[-48,18,-7,.91,2,.78,.3]];function heroMarkup(item){return '<div class="shared-scale"><div class="shared-hero"><div class="shared-tag">'+item.tag+'</div><div class="shared-emoji">'+item.emoji+'</div><div class="shared-copy"><h2>'+item.title+'</h2><p>Swipe 또는 버튼으로 앞뒤 카드를 왕복합니다.</p></div></div></div>'}function render(){deck.innerHTML='';items.forEach(function(item,i){var c=document.createElement('article');c.className='card';c.dataset.index=i;c.style.setProperty('--c1',item.c1);c.style.setProperty('--c2',item.c2);c.style.setProperty('--glow',item.glow);c.innerHTML=heroMarkup(item);deck.appendChild(c)});recalcHero();apply()}function recalcHero(){var rect=deck.getBoundingClientRect();heroW=innerWidth;heroScale=rect.width/heroW;heroH=rect.height/heroScale;cards().forEach(function(c){c.style.setProperty('--heroW',heroW+'px');c.style.setProperty('--heroH',heroH+'px');c.style.setProperty('--heroScale',heroScale)})}function cards(){return Array.prototype.slice.call(deck.querySelectorAll('.card'))}function activeEl(){return cards()[active]}function offsetEl(o){return cards()[(active+o+5)%5]}function apply(){cards().forEach(function(el,i){el.style.visibility='';var r=(i-active+5)%5,f=pos[r];el.style.transform='translate3d('+f[0]+'px,'+f[1]+'px,0) rotate('+f[2]+'deg) scale('+f[3]+')';el.style.zIndex=f[4];el.style.opacity=f[5];el.style.filter='blur('+f[6]+'px) saturate('+(1-r*.04)+')'});Array.prototype.slice.call(pager.children).forEach(function(dot,i){dot.className='dot'+(i===active?' on':'')});status.textContent='현재 카드 '+(active+1)+' / 5 · 탭하면 상세'}function setIndex(i){active=(i+5)%5;apply()}function go(d){if(detailOpen||Date.now()<lockUntil)return;setIndex(active+d)}function pt(e){return e.touches&&e.touches.length?e.touches[0]:e.changedTouches&&e.changedTouches.length?e.changedTouches[0]:e}function clearReveal(){if(!revealCard)return;revealCard.classList.remove('reveal-behind');revealCard.style.transform='';revealCard.style.opacity='';revealCard.style.filter='';revealCard.style.zIndex='';revealCard=null;apply()}function reveal(dx){if(!activeCard)return;if(Math.abs(dx)<8){clearReveal();return}var next=offsetEl(dx<0?1:-1);if(next!==revealCard){if(revealCard)revealCard.classList.remove('reveal-behind');revealCard=next;revealCard.classList.add('reveal-behind')}var p=Math.min(1,Math.abs(dx)/150),side=dx<0?1:-1,x=side*(42-24*p),y=17-10*p,rot=side*(6-4*p),sc=.91+.055*p;revealCard.style.transform='translate3d('+x+'px,'+y+'px,-18px) rotate('+rot+'deg) scale('+sc+')';revealCard.style.opacity=String(.78+.16*p);revealCard.style.zIndex='9'}function detailHTML(item){return '<div class="detail-scroll"><section class="hero-box">'+heroMarkup(item)+'</section><section class="detail-body"><div class="detail-kicker">'+item.tag+'</div><h3>'+item.title+' 이야기</h3><p class="detail-lead">'+item.lead+'</p><div class="story"><h4>오늘의 장면</h4><p>덱 카드와 상세 카드가 같은 shared hero DOM 구조를 사용합니다.</p></div><div class="story"><h4>전환 원칙</h4><p>닫힐 때는 콘텐츠가 먼저 사라지고, 이미지와 텍스트가 포함된 hero만 원래 카드 위치로 축소됩니다.</p></div><div class="story"><h4>Pull down</h4><p>상세 최상단에서 아래로 당기면 카드 덱으로 돌아갑니다.</p></div></section></div>'}function openDetail(card){if(detailOpen)return;detailOpen=true;var item=items[+card.dataset.index],rect=card.getBoundingClientRect(),layer=document.createElement('div'),detail=document.createElement('article'),close=document.createElement('button');layer.className='detail-layer';detail.className='detail-card';close.className='close-btn';close.type='button';close.textContent='×';detail.style.setProperty('--c1',item.c1);detail.style.setProperty('--c2',item.c2);detail.style.setProperty('--glow',item.glow);detail.style.setProperty('--heroW',heroW+'px');detail.style.setProperty('--heroH',heroH+'px');detail.style.setProperty('--heroScale',heroScale);detail.style.left=rect.left+'px';detail.style.top=rect.top+'px';detail.style.width=rect.width+'px';detail.style.height=rect.height+'px';detail.innerHTML=detailHTML(item);layer.appendChild(detail);layer.appendChild(close);document.body.appendChild(layer);var scrollEl=detail.querySelector('.detail-scroll'),bodyEl=detail.querySelector('.detail-body');app.classList.add('detail-open');requestAnimationFrame(function(){card.style.visibility='hidden';layer.classList.add('visible');detail.style.left='0px';detail.style.top='0px';detail.style.width='100vw';detail.style.height='100dvh';detail.style.borderRadius='0px';detail.style.boxShadow='none';detail.style.setProperty('--heroScale',1)});setTimeout(function(){detail.classList.add('open')},40);function closeDetail(){if(!detailOpen)return;detailOpen=false;detail.classList.add('closing');layer.classList.add('closing');if(scrollEl)scrollEl.scrollTop=0;var target=card.getBoundingClientRect();setTimeout(function(){layer.classList.remove('visible');detail.style.left=target.left+'px';detail.style.top=target.top+'px';detail.style.width=target.width+'px';detail.style.height=target.height+'px';detail.style.borderRadius='28px';detail.style.boxShadow='0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08)';detail.style.transform='';detail.style.setProperty('--heroScale',heroScale);detail.classList.remove('open')},80);setTimeout(function(){card.style.visibility='';app.classList.remove('detail-open');layer.remove();apply()},700)}close.onclick=closeDetail;var sy=0,dy=0,armed=false,dragging=false;scrollEl.addEventListener('touchstart',function(e){if(scrollEl.scrollTop>0)return;sy=e.touches[0].clientY;dy=0;armed=true;dragging=false},{passive:true});scrollEl.addEventListener('touchmove',function(e){if(!armed)return;dy=e.touches[0].clientY-sy;if(dy<=0)return;if(scrollEl.scrollTop<=0){e.preventDefault();dragging=true;var p=Math.min(1,dy/160),s=1-p*.08;detail.style.transition='none';layer.style.transition='none';detail.style.transform='translate3d(0,'+(dy*.72)+'px,0) scale('+s+')';detail.style.borderRadius=(p*28)+'px';layer.style.background='rgba(247,241,232,'+(0.96*(1-p))+')';if(bodyEl)bodyEl.style.opacity=String(1-p)}},{passive:false});scrollEl.addEventListener('touchend',function(){if(!armed)return;armed=false;if(!dragging)return;dragging=false;detail.style.transition='';layer.style.transition='';if(dy>110){closeDetail()}else{detail.style.transform='';detail.style.borderRadius='0px';layer.style.background='rgba(247,241,232,.96)';if(bodyEl)bodyEl.style.opacity=''}},{passive:true})}function start(e){if(detailOpen||Date.now()<lockUntil)return;if(!(e.target===deck||deck.contains(e.target)))return;var p=pt(e);activeCard=activeEl();if(!activeCard)return;isDown=true;startX=p.clientX;startY=p.clientY;clearReveal();activeCard.classList.remove('throwing-now');activeCard.classList.add('dragging-now');activeCard.style.zIndex='10';if(e.cancelable)e.preventDefault()}function move(e){if(!isDown||!activeCard||detailOpen)return;var p=pt(e),dx=p.clientX-startX,dy=p.clientY-startY;if(e.cancelable)e.preventDefault();reveal(dx);var lift=Math.min(26,Math.abs(dx)*.07),rot=dx*.05,op=Math.max(.74,1-Math.abs(dx)/460);activeCard.style.transform='translate3d('+dx+'px,'+(dy-lift)+'px,0) rotate('+rot+'deg) scale(1.025)';activeCard.style.opacity=String(op)}function end(e){if(!isDown||!activeCard||detailOpen)return;var p=pt(e),dx=p.clientX-startX,dy=p.clientY-startY,dist=Math.hypot(dx,dy),tap=dist<8,swipe=Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*.75,dir=dx<0?1:-1;isDown=false;if(tap){activeCard.classList.remove('dragging-now');activeCard.style.transform='';activeCard.style.opacity='';activeCard.style.zIndex='';if(revealCard){revealCard.classList.remove('reveal-behind');revealCard=null}apply();openDetail(activeEl());activeCard=null;return}if(swipe){var outSign=dx<0?-1:1,outX=outSign*Math.max(innerWidth*.72,360),outY=-28,rot=outSign*18;activeCard.classList.add('throwing-now');activeCard.style.transform='translate3d('+outX+'px,'+outY+'px,0) rotate('+rot+'deg) scale(.96)';lockUntil=Date.now()+260;setTimeout(function(){var old=activeCard;setIndex(active+dir);if(old){old.classList.remove('dragging-now','throwing-now');old.style.transform='';old.style.opacity='';old.style.zIndex=''}clearReveal();activeCard=null},210)}else{activeCard.classList.remove('dragging-now');activeCard.style.transform='';activeCard.style.opacity='';activeCard.style.zIndex='';clearReveal();activeCard=null}}function cancel(){isDown=false;if(activeCard){activeCard.classList.remove('dragging-now','throwing-now');activeCard.style.transform='';activeCard.style.opacity='';activeCard.style.zIndex=''}if(revealCard){revealCard.classList.remove('reveal-behind');revealCard=null}activeCard=null;apply()}deck.addEventListener('touchstart',start,{passive:false});deck.addEventListener('touchmove',move,{passive:false});deck.addEventListener('touchend',end,{passive:false});deck.addEventListener('touchcancel',cancel,{passive:false});stage.addEventListener('touchstart',start,{passive:false,capture:true});stage.addEventListener('touchmove',move,{passive:false,capture:true});stage.addEventListener('touchend',end,{passive:false,capture:true});deck.addEventListener('mousedown',start);window.addEventListener('mousemove',move);window.addEventListener('mouseup',end);prevBtn.onclick=function(){go(-1)};nextBtn.onclick=function(){go(1)};window.addEventListener('resize',function(){recalcHero();apply()});render();})();</script></body></html>
