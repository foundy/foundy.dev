<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Card Deck v19.0.2 Restore No Replay</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8;}
</style>
</head>
<body>
<iframe id="preview" src="/prototypes/card-deck-v19.0.1-promoted-card-body-layer.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('preview');

  function inject(){
    var doc=frame.contentDocument;
    if(!doc)return;

    if(!doc.getElementById('v19-0-2-no-replay-style')){
      var style=doc.createElement('style');
      style.id='v19-0-2-no-replay-style';
      style.textContent=[
        'html.v19-restore-lock .deck .card,',
        'body.v19-restore-lock .deck .card{',
        '  transition:none!important;',
        '}',
        'html.v19-restore-lock .deck .shared-scale,',
        'body.v19-restore-lock .deck .shared-scale{',
        '  transition:none!important;',
        '}',
        'html.v19-restore-lock .pager .dot,',
        'body.v19-restore-lock .pager .dot{',
        '  transition:none!important;',
        '}'
      ].join('\n');
      doc.head.appendChild(style);
    }

    function lockRestoreTransition(duration){
      doc.documentElement.classList.add('v19-restore-lock');
      doc.body.classList.add('v19-restore-lock');
      clearTimeout(doc.__v1902RestoreTimer);
      doc.__v1902RestoreTimer=setTimeout(function(){
        doc.documentElement.classList.remove('v19-restore-lock');
        doc.body.classList.remove('v19-restore-lock');
      },duration || 760);
    }

    function patchPromoted(card){
      if(!card || card.__v1902Patched)return;
      card.__v1902Patched=true;

      var observer=new MutationObserver(function(){
        if(card.classList.contains('closing')){
          // v19.0.1은 closing 후 약 610~650ms에 deck으로 복원된다.
          // 복원 직전부터 직후까지 deck transition을 끈다.
          setTimeout(function(){lockRestoreTransition(780)},420);
        }
      });
      observer.observe(card,{attributes:true,attributeFilter:['class']});
    }

    function patchAll(){
      doc.querySelectorAll('.card.promoted').forEach(patchPromoted);
    }

    patchAll();
    if(!doc.__v1902Observer){
      doc.__v1902Observer=new MutationObserver(patchAll);
      doc.__v1902Observer.observe(doc.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['class']});
    }
  }

  frame.addEventListener('load',inject);
  setInterval(inject,300);
})();
</script>
</body>
</html>
