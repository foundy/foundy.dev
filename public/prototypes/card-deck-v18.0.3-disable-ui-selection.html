<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Card Deck v18.0.3 Disable UI Selection</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8;overscroll-behavior:none;touch-action:manipulation;-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8;touch-action:manipulation;}
</style>
</head>
<body>
<iframe id="preview" src="/prototypes/card-deck-v18-pointer-gesture-fix.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('preview');
  var lastParentTouchEnd=0;

  function isFastClickAllowed(target){
    return !!(target && target.closest && target.closest('button,.btn,.controls,label,[role="button"],a'));
  }

  function isNonTextUi(target){
    return !!(target && target.closest && target.closest('button,.btn,.controls,.pager,.dot,label,[role="button"],.deck,.stage,.card,.close-btn'));
  }

  document.addEventListener('touchend',function(e){
    if(isFastClickAllowed(e.target)) return;
    var now=Date.now();
    if(now-lastParentTouchEnd<350){
      e.preventDefault();
    }
    lastParentTouchEnd=now;
  },{capture:true,passive:false});

  document.addEventListener('contextmenu',function(e){
    if(isNonTextUi(e.target)) e.preventDefault();
  },{capture:true});

  function inject(){
    var doc=frame.contentDocument;
    if(!doc)return;

    var meta=doc.querySelector('meta[name="viewport"]');
    if(!meta){
      meta=doc.createElement('meta');
      meta.name='viewport';
      doc.head.appendChild(meta);
    }
    meta.setAttribute('content','width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover');

    if(!doc.getElementById('v18-0-3-disable-ui-selection-style')){
      var style=doc.createElement('style');
      style.id='v18-0-3-disable-ui-selection-style';
      style.textContent=[
        'html,body{touch-action:manipulation!important;overscroll-behavior:none!important;-webkit-text-size-adjust:100%!important;-webkit-tap-highlight-color:transparent!important;}',
        'button,.btn,.controls,.controls *,.pager,.pager *,.dot,label,[role="button"],.close-btn{touch-action:manipulation!important;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;}',
        '.deck,.stage,.card,.card *{touch-action:none!important;-webkit-tap-highlight-color:transparent!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;}',
        '.detail-layer,.detail-card,.hero-box,.shared-scale,.shared-hero,.shared-tag,.shared-emoji{touch-action:none!important;-webkit-touch-callout:none!important;-webkit-user-select:none!important;user-select:none!important;}',
        '.detail-scroll{touch-action:pan-y!important;}',
        '.detail-body,.detail-body *{user-select:text;-webkit-user-select:text;-webkit-touch-callout:default;}',
        'button:focus,.btn:focus,label:focus{outline:none!important;}',
        '*{-webkit-tap-highlight-color:transparent;}'
      ].join('\n');
      doc.head.appendChild(style);
    }

    if(!doc.__v1803DisableUiSelection){
      doc.__v1803DisableUiSelection=true;
      var lastTouchEnd=0;

      doc.addEventListener('touchend',function(e){
        if(isFastClickAllowed(e.target)) return;
        var now=Date.now();
        if(now-lastTouchEnd<350){
          e.preventDefault();
        }
        lastTouchEnd=now;
      },{capture:true,passive:false});

      doc.addEventListener('selectstart',function(e){
        if(isNonTextUi(e.target)) e.preventDefault();
      },{capture:true,passive:false});

      doc.addEventListener('contextmenu',function(e){
        if(isNonTextUi(e.target)) e.preventDefault();
      },{capture:true,passive:false});

      doc.addEventListener('gesturestart',function(e){e.preventDefault();},{capture:true,passive:false});
      doc.addEventListener('gesturechange',function(e){e.preventDefault();},{capture:true,passive:false});
      doc.addEventListener('gestureend',function(e){e.preventDefault();},{capture:true,passive:false});
    }
  }

  frame.addEventListener('load',inject);
  setInterval(inject,500);
})();
</script>
</body>
</html>
