<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1" />
<title>Card Deck v11 Vertical Detail</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f1e8}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#f7f1e8}
</style>
</head>
<body>
<iframe id="preview" src="/prototypes/card-deck-v10-from-v2-shared-hero.html"></iframe>
<script>
(function(){
  var frame=document.getElementById('preview');
  function inject(){
    var doc=frame.contentDocument;
    var win=frame.contentWindow;
    if(!doc||!win)return;

    if(!doc.getElementById('v11-vertical-detail-style')){
      var style=doc.createElement('style');
      style.id='v11-vertical-detail-style';
      style.textContent=[
        'html,body{overflow:hidden!important;overscroll-behavior:none!important;}',
        '.detail-layer{overflow:hidden!important;touch-action:none!important;}',
        '.detail-card{overflow:hidden!important;max-width:100vw!important;touch-action:pan-y!important;}',
        '.detail-scroll{overflow-x:hidden!important;overflow-y:auto!important;width:100%!important;max-width:100vw!important;touch-action:pan-y!important;overscroll-behavior-y:contain!important;overscroll-behavior-x:none!important;}',
        '.detail-scroll>*{max-width:100vw!important;}',
        '.hero-box,.shared-scale,.shared-hero,.detail-body{max-width:100vw!important;}',
        '.detail-body{overflow-x:hidden!important;}'
      ].join('\n');
      doc.head.appendChild(style);
    }

    function patchScroll(el){
      if(!el||el.__v11Patched)return;
      el.__v11Patched=true;
      var sx=0,sy=0,mode=null;

      el.addEventListener('touchstart',function(e){
        if(!e.touches||!e.touches.length)return;
        sx=e.touches[0].clientX;
        sy=e.touches[0].clientY;
        mode=null;
      },{capture:true,passive:true});

      el.addEventListener('touchmove',function(e){
        if(!e.touches||!e.touches.length)return;
        var dx=e.touches[0].clientX-sx;
        var dy=e.touches[0].clientY-sy;
        var ax=Math.abs(dx);
        var ay=Math.abs(dy);

        if(!mode && (ax>6||ay>6)){
          mode=ax>ay*1.15?'horizontal':'vertical';
        }

        if(mode==='horizontal'){
          // v10의 pull-down listener보다 먼저 가로 gesture를 차단한다.
          e.preventDefault();
          e.stopImmediatePropagation();
          return false;
        }
      },{capture:true,passive:false});
    }

    function patchAll(){
      doc.querySelectorAll('.detail-scroll').forEach(patchScroll);
    }

    patchAll();
    if(!doc.__v11Observer){
      doc.__v11Observer=new MutationObserver(patchAll);
      doc.__v11Observer.observe(doc.documentElement,{childList:true,subtree:true});
    }
  }

  frame.addEventListener('load',inject);
  setInterval(inject,500);
})();
</script>
</body>
</html>
