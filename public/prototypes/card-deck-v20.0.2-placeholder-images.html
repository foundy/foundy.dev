<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
<title>Card Deck v20.0.2 Placeholder Images</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7f1e8;color:#251f19;overflow:hidden;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}.app{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto auto;gap:14px;padding:24px 18px 22px}header{text-align:center}h1{margin:0 0 6px;font-size:20px;letter-spacing:-.04em}.note{margin:0 auto;max-width:390px;color:#806f60;font-size:13px;line-height:1.45}.stage{display:grid;place-items:center;min-height:520px;touch-action:none}.deck{position:relative;width:min(72vw,310px);height:min(106vw,430px);max-height:430px;min-height:390px;perspective:1000px;touch-action:none}.card{position:absolute;inset:0;border-radius:28px;overflow:hidden;background:#f6efe5;box-shadow:0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08);border:1px solid rgba(255,255,255,.72);transition:transform 520ms cubic-bezier(.18,1.15,.24,1),opacity 280ms ease,filter 280ms ease,border-radius 520ms cubic-bezier(.22,1,.36,1),box-shadow 520ms cubic-bezier(.22,1,.36,1);will-change:transform;touch-action:none}.hero{position:absolute;inset:0;background:linear-gradient(180deg,#fffaf1,#f1e3d1)}.product-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center;transform:scale(1.02);filter:saturate(.98) contrast(.98)}.shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 48%,rgba(0,0,0,.38) 100%)}.tag{position:absolute;left:22px;top:22px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);font-size:11px;font-weight:900;letter-spacing:.04em;color:rgba(42,33,27,.62)}.copy{position:absolute;left:24px;right:24px;bottom:24px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.22)}.copy h2{margin:0;font-size:30px;line-height:1.02;letter-spacing:-.06em}.copy p{margin:8px 0 0;font-size:13px;line-height:1.42;color:rgba(255,255,255,.86)}.controls{min-height:54px;display:flex;gap:10px;align-items:center;justify-content:center}.btn{border:0;min-width:112px;padding:14px 18px;border-radius:999px;font-size:15px;font-weight:800;cursor:pointer;touch-action:manipulation}.primary{background:#2a211b;color:#fff;box-shadow:0 12px 24px rgba(42,33,27,.18)}.ghost{background:rgba(255,255,255,.84);border:1px solid rgba(42,33,27,.1);color:#2a211b}.pager{display:flex;justify-content:center;gap:8px;min-height:22px}.dot{width:8px;height:8px;border-radius:50%;background:#2a211b;opacity:.25;transition:opacity .2s,transform .2s}.dot.on{opacity:1;transform:scale(1.25)}.status{text-align:center;color:#806f60;font-size:12px}.dragging{transition:none!important;z-index:10!important}.throwing{transition:transform 260ms cubic-bezier(.16,.84,.29,1),opacity 220ms ease!important;opacity:0!important;z-index:10!important}.reveal{transition:transform 180ms cubic-bezier(.18,1.15,.24,1),opacity 160ms ease!important;z-index:9!important;opacity:.92!important}.scrim{position:fixed;inset:0;z-index:900;background:rgba(247,241,232,0);pointer-events:none;transition:background 420ms cubic-bezier(.22,1,.36,1)}.scrim.visible{background:rgba(247,241,232,.96);pointer-events:auto}.detail-open .deck{pointer-events:none}.detail-open header,.detail-open .controls,.detail-open .pager,.detail-open .status{opacity:.18;transition:opacity 200ms ease}.card.promoted{position:fixed!important;left:0!important;top:0!important;right:auto!important;bottom:auto!important;width:100vw!important;height:100dvh!important;z-index:1001!important;border-radius:0;box-shadow:none;transform-origin:top left;transition:transform 520ms cubic-bezier(.22,1,.36,1),border-radius 520ms cubic-bezier(.22,1,.36,1),box-shadow 520ms cubic-bezier(.22,1,.36,1);overflow:hidden;contain:layout paint style}.detail-scroll{height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;touch-action:pan-y}.detail-hero{position:relative;height:64vh;min-height:520px;overflow:hidden}.detail-hero .copy h2{font-size:42px}.detail-body{background:rgba(255,255,255,.78);backdrop-filter:blur(18px);border-top:1px solid rgba(255,255,255,.56);border-radius:32px 32px 0 0;margin-top:-28px;padding:32px 24px 88px;opacity:0;transform:translateY(28px);transition:opacity 280ms ease 190ms,transform 360ms cubic-bezier(.22,1,.36,1) 190ms;-webkit-user-select:text;user-select:text}.card.promoted.open .detail-body{opacity:1;transform:translateY(0)}.card.promoted.closing .detail-body{opacity:0!important;transform:translateY(18px)!important;transition:opacity 120ms ease,transform 120ms ease!important}.detail-body h3{font-size:30px;line-height:1.08;letter-spacing:-.05em;margin:0 0 14px}.detail-body p{font-size:16px;line-height:1.65;color:rgba(42,33,27,.72)}.story{padding:22px 0;border-top:1px solid rgba(42,33,27,.08)}.close-btn{position:fixed;right:18px;top:calc(18px + env(safe-area-inset-top));z-index:1002;width:38px;height:38px;border:0;border-radius:999px;background:rgba(255,255,255,.75);backdrop-filter:blur(14px);box-shadow:0 8px 24px rgba(42,33,27,.14);font-size:22px;font-weight:700;color:#2a211b;opacity:0;transform:scale(.88);transition:opacity 180ms ease 220ms,transform 220ms ease 220ms}.close-btn.visible{opacity:1;transform:scale(1)}@media(max-height:720px){.stage{min-height:450px}.deck{width:260px;height:360px;min-height:360px}.detail-hero{min-height:440px}}
</style>
</head>
<body>
<main class="app" id="app"><header><h1>Product Image Card Deck</h1><p class="note">v20.0.2 · repo asset 문제를 우회하기 위해 외부 placeholder 이미지를 사용합니다.</p></header><section class="stage"><div class="deck" id="deck"></div></section><nav class="controls"><button class="btn ghost" id="prevBtn">← Swipe</button><button class="btn primary" id="nextBtn">Swipe →</button></nav><div class="pager" id="pager"></div><div class="status" id="status">탭하면 상세 · 좌우 드래그하면 카드 전환</div></main><div class="scrim" id="scrim"></div><button class="close-btn" id="closeBtn">×</button>
<script>
(function(){
var products=[
{title:'Ivory Crochet Bonnet',tag:'IVORY',image:'https://picsum.photos/seed/bonnet-ivory/900/1400'},
{title:'Red Crochet Bonnet',tag:'RED',image:'https://picsum.photos/seed/bonnet-red/900/1400'},
{title:'Blue Crochet Bonnet',tag:'SKY BLUE',image:'https://picsum.photos/seed/bonnet-blue/900/1400'},
{title:'Green Crochet Bonnet',tag:'GREEN',image:'https://picsum.photos/seed/bonnet-green/900/1400'},
{title:'Yellow Crochet Bonnet',tag:'YELLOW',image:'https://picsum.photos/seed/bonnet-yellow/900/1400'}
];
var app=document.getElementById('app'),deck=document.getElementById('deck'),pager=document.getElementById('pager'),status=document.getElementById('status'),scrim=document.getElementById('scrim'),closeBtn=document.getElementById('closeBtn');
var active=0,pointerId=null,startX=0,startY=0,activeCard=null,revealCard=null,gesture=null,detailOpen=false,promoted=null,placeholder=null,originRect=null,lastTouchEnd=0;
var pos=[[0,0,0,1,5,1,0],[48,18,7,.91,3,.78,.3],[92,36,12,.82,1,.58,.6],[-92,36,-12,.82,1,.58,.6],[-48,18,-7,.91,2,.78,.3]];
function cardHTML(i,detail){var p=products[i];return (detail?'<div class="detail-scroll"><section class="detail-hero">':'')+'<div class="hero"><img class="product-img" src="'+p.image+'" alt="'+p.title+'"><div class="shade"></div><div class="tag">'+p.tag+'</div><div class="copy"><h2>'+p.title+'</h2><p>Handmade baby bonnet collection</p></div></div>'+(detail?'</section><section class="detail-body"><h3>'+p.title+'</h3><p>현재 이미지는 외부 placeholder resource입니다. 덱/상세 전환 모션 검증을 위해 실제 상품 이미지 asset 문제와 분리했습니다.</p><div class="story"><h4>Resource</h4><p>각 카드는 picsum.photos의 seed 기반 placeholder 이미지를 사용합니다.</p></div><div class="story"><h4>Layout</h4><p>이미지는 card 전체에 object-fit: cover로 채우고, 하단 gradient 위에 상품명과 보조 텍스트를 배치했습니다.</p></div></section></div>':'');}
function render(){deck.innerHTML='';pager.innerHTML='';products.forEach(function(_,i){var c=document.createElement('article');c.className='card';c.dataset.index=i;c.innerHTML=cardHTML(i,false);deck.appendChild(c);var d=document.createElement('span');d.className='dot';pager.appendChild(d)});apply()}
function cards(){return Array.prototype.slice.call(deck.querySelectorAll('.card'))}function activeEl(){return cards()[active]}function offset(o){return cards()[(active+o+5)%5]}function apply(){cards().forEach(function(el,i){if(el===promoted)return;var r=(i-active+5)%5,f=pos[r];el.classList.remove('dragging','throwing','reveal');el.style.transform='translate3d('+f[0]+'px,'+f[1]+'px,0) rotate('+f[2]+'deg) scale('+f[3]+')';el.style.zIndex=f[4];el.style.opacity=f[5];el.style.filter='blur('+f[6]+'px)'});Array.prototype.slice.call(pager.children).forEach(function(d,i){d.className='dot'+(i===active?' on':'')});status.textContent='현재 카드 '+(active+1)+' / 5 · 탭하면 상세'}
function setIndex(i){active=(i+5)%5;apply()}function reveal(dx){if(!activeCard)return;var next=offset(dx<0?1:-1);if(next!==revealCard){if(revealCard)revealCard.classList.remove('reveal');revealCard=next;revealCard.classList.add('reveal')}var p=Math.min(1,Math.abs(dx)/150),side=dx<0?1:-1;revealCard.style.transform='translate3d('+(side*(42-24*p))+'px,'+(17-10*p)+'px,0) rotate('+(side*(6-4*p))+'deg) scale('+(.91+.055*p)+')';revealCard.style.zIndex=9;revealCard.style.opacity=.78+.16*p}
function reset(){pointerId=null;gesture=null;activeCard=null;revealCard=null;apply()}function targetTransform(r){return 'translate3d('+r.left+'px,'+r.top+'px,0) scale('+(r.width/innerWidth)+','+(r.height/innerHeight)+')'}
function promote(card){if(detailOpen)return;detailOpen=true;promoted=card;var i=+card.dataset.index;originRect=card.getBoundingClientRect();placeholder=document.createComment('placeholder');deck.insertBefore(placeholder,card.nextSibling);document.body.appendChild(card);card.className='card promoted';card.style.transform=targetTransform(originRect);card.style.borderRadius='28px';card.style.zIndex=1001;card.style.opacity=1;card.style.filter='none';card.innerHTML=cardHTML(i,true);app.classList.add('detail-open');requestAnimationFrame(function(){scrim.classList.add('visible');card.style.transform='translate3d(0,0,0) scale(1,1)';card.style.borderRadius='0';card.style.boxShadow='none'});setTimeout(function(){card.classList.add('open');closeBtn.classList.add('visible')},40);closeBtn.onclick=function(){closeDetail(card,i)}}
function closeDetail(card,i){if(!detailOpen)return;detailOpen=false;card.classList.add('closing');closeBtn.classList.remove('visible');var body=card.querySelector('.detail-body');if(body){body.style.opacity=0;body.style.transform='translateY(18px)'}setTimeout(function(){card.style.transition='transform 460ms cubic-bezier(.22,1,.36,1),border-radius 460ms cubic-bezier(.22,1,.36,1),box-shadow 460ms cubic-bezier(.22,1,.36,1)';scrim.classList.remove('visible');card.style.transform=targetTransform(originRect);card.style.borderRadius='28px';card.style.boxShadow='0 24px 60px rgba(65,43,26,.20),0 4px 12px rgba(65,43,26,.08)'},120);setTimeout(function(){card.className='card';card.style.cssText='';card.innerHTML=cardHTML(i,false);placeholder.parentNode.insertBefore(card,placeholder);placeholder.remove();placeholder=null;promoted=null;app.classList.remove('detail-open');apply()},630)}
deck.addEventListener('pointerdown',function(e){if(detailOpen||pointerId!==null)return;if(!(e.target===deck||deck.contains(e.target)))return;pointerId=e.pointerId;startX=e.clientX;startY=e.clientY;gesture=null;activeCard=activeEl();deck.setPointerCapture(pointerId)});
deck.addEventListener('pointermove',function(e){if(pointerId!==e.pointerId||!activeCard||detailOpen)return;var dx=e.clientX-startX,dy=e.clientY-startY,ax=Math.abs(dx),ay=Math.abs(dy);if(!gesture&&(ax>7||ay>7)){gesture=ay>ax*1.15?'v':'h';if(gesture==='v'){reset();return}activeCard.classList.add('dragging');activeCard.style.zIndex=10}if(gesture!=='h')return;e.preventDefault();reveal(dx);activeCard.style.transform='translate3d('+dx+'px,'+(dy-Math.min(26,Math.abs(dx)*.07))+'px,0) rotate('+(dx*.05)+'deg) scale(1.025)';activeCard.style.opacity=Math.max(.74,1-Math.abs(dx)/460)});
deck.addEventListener('pointerup',function(e){if(pointerId!==e.pointerId||!activeCard){reset();return}var dx=e.clientX-startX,dy=e.clientY-startY,dist=Math.hypot(dx,dy),tap=dist<8&&!gesture,swipe=gesture==='h'&&Math.abs(dx)>56&&Math.abs(dx)>Math.abs(dy)*.75,dir=dx<0?1:-1;if(tap){var selected=activeEl();reset();promote(selected);return}if(swipe){var old=activeCard,out=dx<0?-1:1;old.classList.add('throwing');old.style.transform='translate3d('+(out*Math.max(innerWidth*.72,360))+'px,-28px,0) rotate('+(out*18)+'deg) scale(.96)';pointerId=null;gesture=null;setTimeout(function(){setIndex(active+dir)},210)}else reset()});
deck.addEventListener('pointercancel',reset);document.getElementById('prevBtn').onclick=function(){if(!detailOpen)setIndex(active-1)};document.getElementById('nextBtn').onclick=function(){if(!detailOpen)setIndex(active+1)};document.addEventListener('touchend',function(e){var fast=e.target&&e.target.closest&&e.target.closest('button,.btn,.controls,label,[role="button"],a');if(fast)return;var now=Date.now();if(now-lastTouchEnd<350)e.preventDefault();lastTouchEnd=now},{capture:true,passive:false});document.addEventListener('selectstart',function(e){var ui=e.target&&e.target.closest&&e.target.closest('button,.btn,.controls,.pager,.dot,label,[role="button"],.deck,.stage,.card,.close-btn');if(ui)e.preventDefault()},{capture:true,passive:false});render();
})();
</script>
</body>
</html>
